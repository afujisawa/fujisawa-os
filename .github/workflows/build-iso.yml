name: build-iso
# Gera a ISO de instalação do Fujisawa OS (instalador Anaconda) com o
# bootc-image-builder, a partir da imagem publicada no ghcr.io.
# Execução manual: aba Actions > build-iso > Run workflow.
# A ISO fica disponível como artifact da execução.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem em ghcr.io/afujisawa/fujisawa-os"
        required: true
        default: latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fujisawa-os:${{ inputs.image_tag }}
  BUILDER_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

jobs:
  build-iso:
    name: Gerar ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A imagem, o builder e a ISO não cabem nos ~14 GB livres do runner
      - name: Liberar espaço em disco
        uses: ublue-os/remove-unwanted-software@v9

      - name: Baixar a imagem e o bootc-image-builder
        run: |
          sudo podman pull "$IMAGE"
          sudo podman pull "$BUILDER_IMAGE"

      # iso/config.toml troca o kickstart padrão por um interativo: o instalador
      # pergunta o disco e mostra a criação de usuário, e o sistema instalado
      # passa a buscar atualizações em ghcr.io/afujisawa/fujisawa-os:latest
      - name: Gerar a ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v "$PWD/iso/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BUILDER_IMAGE" \
            --type anaconda-iso --rootfs btrfs --use-librepo=True \
            "$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Renomear e gerar checksum
        id: iso
        run: |
          NAME="fujisawa-os-${{ inputs.image_tag }}-$(date -u +%Y%m%d).iso"
          mv output/bootiso/install.iso "output/$NAME"
          (cd output && sha256sum "$NAME" > "$NAME-CHECKSUM")
          ls -lh output
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar a ISO como artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            output/${{ steps.iso.outputs.name }}
            output/${{ steps.iso.outputs.name }}-CHECKSUM
            output/manifest-anaconda-iso.json
          if-no-files-found: error
          compression-level: 0 # a ISO já é comprimida
          retention-days: 30
