---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: fujisawa-os
# description will be included in the image's metadata
description: Fedora Atomic mínimo (Universal Blue) com o desktop COSMIC e o navegador Vivaldi.

# Imagem base mínima da Universal Blue (sem ambiente desktop)
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    group-install:
      packages:
        - cosmic-desktop # COSMIC (sessão, painel, greeter e apps base)

  - type: script
    snippets:
      - systemctl set-default graphical.target # inicia direto no login gráfico

  - type: systemd
    system:
      enabled:
        - cosmic-greeter.service

  # Vivaldi pelo Flathub (instalado no primeiro boot, atualiza fora da imagem)
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.vivaldi.Vivaldi

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
